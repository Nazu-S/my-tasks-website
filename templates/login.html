<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to My Tasks — your personal to-do manager." />
  <title>Log In — My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body class="auth-page">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="container auth-container">
    <header class="hero">
      <div class="hero-icon">✅</div>
      <h1>My Tasks</h1>
      <p class="subtitle">Welcome back — log in to your tasks.</p>
    </header>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-msg flash-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <section class="card auth-card" aria-label="Log in">
      <form id="login-form" method="POST" action="/login" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            placeholder="Your password"
            autocomplete="current-password"
            required
          />
        </div>

        <p id="login-error" class="error-msg" role="alert" aria-live="polite"></p>

        <button id="login-btn" type="submit" class="btn btn-primary auth-submit-btn">
          Log In
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="/signup" class="auth-link">Sign up for free</a>
      </p>
    </section>
  </main>

  <script>
    // Client-side: disable button on submit to prevent double-submit
    document.getElementById("login-form").addEventListener("submit", function () {
      document.getElementById("login-btn").disabled = true;
      document.getElementById("login-btn").textContent = "Logging in…";
    });
  </script>
</body>

</html>
