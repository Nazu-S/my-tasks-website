<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a free My Tasks account — your personal to-do manager." />
  <title>Sign Up — My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="container auth-container">
    <header class="hero">
      <div class="hero-icon">✅</div>
      <h1>My Tasks</h1>
      <p class="subtitle">Create your free account and stay organised.</p>
    </header>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-msg flash-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <section class="card auth-card" aria-label="Sign up">
      <form id="signup-form" method="POST" action="/signup" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Your name</label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-input"
            placeholder="Jane Doe"
            autocomplete="name"
            maxlength="100"
            required
          />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="form-hint">(min 6 characters)</span></label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            placeholder="Create a strong password"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </div>

        <p id="signup-error" class="error-msg" role="alert" aria-live="polite"></p>

        <button id="signup-btn" type="submit" class="btn btn-primary auth-submit-btn">
          Create Account
        </button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="/login" class="auth-link">Log in</a>
      </p>
    </section>
  </main>

  <script>
    // Client-side validation + disable on submit
    document.getElementById("signup-form").addEventListener("submit", function (e) {
      const pw = document.getElementById("password").value;
      if (pw.length < 6) {
        e.preventDefault();
        document.getElementById("signup-error").textContent =
          "Password must be at least 6 characters.";
        return;
      }
      document.getElementById("signup-btn").disabled = true;
      document.getElementById("signup-btn").textContent = "Creating account…";
    });
  </script>
</body>

</html>
